server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,studentstats
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Student Management API
    description: REST API for managing student records
    version: 1.0.0
